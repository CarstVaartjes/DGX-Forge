[project]
name = "dgx-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.42",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
