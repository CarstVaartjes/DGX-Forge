[project]
name = "dgx-control"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "jsonschema==4.25.1",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.42",
  "tomli-w==1.2.0",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgx_control"]
artifacts = ["src/dgx_control/web/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
