name: dgx-forge-control

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-control-environment: &control-environment
  DGX_DEPLOYMENT_MODE: production
  DGX_DATABASE_URL_FILE: /run/secrets/database-url
  DGX_TOKEN_SIGNING_KEY_FILE: /run/secrets/token-signing-key
  DGX_METRICS_TOKEN_FILE: /run/secrets/metrics-token
  DGX_REPOSITORY_PATH: /repository
  DGX_STATE_PATH: /state
  DGX_GIT_SIGNING_KEY_FILE: /run/secrets/git-signing-key
  DGX_DEPLOYMENT_BRANCH: ${DEPLOYMENT_BRANCH:-deploy}
  DGX_REQUIRED_CHECKS: ${REQUIRED_CHECKS:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.api]
    read_only: true
    user: "10001:10001"
    environment:
      <<: *control-environment
      DGX_AGENT_CA_PROVIDER: step-ca
      DGX_AGENT_CLIENT_CA_FILE: /run/secrets/agent-client-ca
      DGX_AGENT_INTERMEDIATE_CERTIFICATE_FILE: /run/secrets/agent-intermediate-certificate
      DGX_AGENT_CA_CREDENTIAL_FILE: /run/secrets/agent-ca-credential
      DGX_AGENT_PROXY_AUTH_FILE: /run/secrets/agent-proxy-auth
    secrets: [database-url, token-signing-key, metrics-token, git-signing-key, agent-client-ca, agent-intermediate-certificate, agent-ca-credential, agent-proxy-auth]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data, agent-proxy]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, dgx_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.worker]
    read_only: true
    user: "10001:10001"
    environment: *control-environment
    secrets: [database-url, token-signing-key, metrics-token, git-signing-key]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data, cluster-egress]
    depends_on:
      postgres: {condition: service_healthy}

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.82.3-stable@sha256:b959a1816fa454a14d2842242d0fa1cd0d39f96fc94d3a1f4e1de4e48e2398c6}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/app/dgx-entrypoint]
    read_only: true
    secrets: [litellm-master-key, litellm-upstream-key, litellm-database-url]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/entrypoint.sh:/app/dgx-entrypoint:ro
    tmpfs: [/tmp]
    networks: [data, ingress, cluster-egress]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle=false
    read_only: true
    user: "65534:65534"
    secrets: [metrics-token]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      control-api: {condition: service_healthy}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "472:472"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana-admin-password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    networks: [application, ingress]
    depends_on: [prometheus]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    ports:
      - ${HTTPS_BIND:-0.0.0.0:443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    command: [/bin/sh, -ec, 'export DGX_AGENT_PROXY_AUTH="$$(cat /run/secrets/agent-proxy-auth)"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile']
    secrets: [agent-client-ca, agent-proxy-auth]
    networks: [ingress, agent-proxy]
    depends_on: [control-api]

  step-ca:
    image: ${STEP_CA_IMAGE:-smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    command: [step-ca, /home/step/config/ca.json, --password-file, /run/secrets/step-ca-password]
    secrets:
      - source: step-ca-root-certificate
        target: root_ca.crt
      - source: agent-intermediate-certificate
        target: intermediate_ca.crt
      - source: step-ca-intermediate-key
        target: intermediate_ca_key
      - source: step-ca-password
        target: step-ca-password
    volumes:
      - ./step-ca/ca.json:/home/step/config/ca.json:ro
      - step-ca-data:/home/step/db
    tmpfs: [/tmp]
    networks: [ca]
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, https://127.0.0.1:9000, --root, /run/secrets/root_ca.crt]
      interval: 15s
      timeout: 5s
      retries: 10

secrets:
  database-url:
    file: "${DATABASE_URL_FILE:?set database URL secret file}"
  postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:?set PostgreSQL password secret file}"
  token-signing-key:
    file: "${TOKEN_SIGNING_KEY_FILE:?set token signing key secret file}"
  metrics-token:
    file: "${METRICS_TOKEN_FILE:?set metrics scrape token secret file}"
  git-signing-key:
    file: "${GIT_SIGNING_KEY_FILE:?set Git SSH signing key file}"
  litellm-master-key:
    file: "${LITELLM_MASTER_KEY_FILE:?set LiteLLM master key secret file}"
  litellm-upstream-key:
    file: "${LITELLM_UPSTREAM_KEY_FILE:?set LiteLLM upstream key secret file}"
  litellm-database-url:
    file: "${LITELLM_DATABASE_URL_FILE:?set LiteLLM database URL secret file}"
  grafana-admin-password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:?set Grafana admin password secret file}"
  agent-client-ca:
    file: "${AGENT_CLIENT_CA_FILE:?set agent client CA certificate secret file}"
  agent-intermediate-certificate:
    file: "${AGENT_INTERMEDIATE_CERTIFICATE_FILE:?set agent intermediate certificate secret file}"
  agent-proxy-auth:
    file: "${AGENT_PROXY_AUTH_FILE:?set agent proxy authentication secret file}"
  agent-ca-credential:
    file: "${AGENT_CA_CREDENTIAL_FILE:?set agent CA provider credential secret file}"
  step-ca-root-certificate:
    file: "${STEP_CA_ROOT_CERTIFICATE_FILE:?set step-ca root certificate secret file}"
  step-ca-intermediate-key:
    file: "${STEP_CA_INTERMEDIATE_KEY_FILE:?set encrypted step-ca intermediate signing key secret file}"
  step-ca-password:
    file: "${STEP_CA_PASSWORD_FILE:?set step-ca password secret file}"

networks:
  ingress: {}
  agent-proxy: {internal: true}
  application: {internal: true}
  data: {internal: true}
  ca: {internal: true}
  cluster-egress: {}

volumes:
  postgres-data: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
  grafana-data: {}
  step-ca-data: {}
