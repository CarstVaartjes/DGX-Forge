name: ${COMPOSE_PROJECT_NAME:-dgx-forge-control}

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-control-environment: &control-environment
  DGX_DEPLOYMENT_MODE: production
  DGX_DATABASE_URL_FILE: /run/secrets/database-url
  DGX_TOKEN_SIGNING_KEY_FILE: /run/secrets/token-signing-key
  DGX_METRICS_TOKEN_FILE: /run/secrets/metrics-token
  DGX_REPOSITORY_PATH: /repository
  DGX_STATE_PATH: /state
  DGX_GIT_SIGNING_KEY_FILE: /run/secrets/git-signing-key
  DGX_DEPLOYMENT_BRANCH: ${DEPLOYMENT_BRANCH:-deploy}
  DGX_REQUIRED_CHECKS: ${REQUIRED_CHECKS:-}
  DGX_MANAGEMENT_CIDRS: ${DGX_MANAGEMENT_CIDRS:?set trusted Spark management CIDRs}
  DGX_DIRECT_FABRIC_CIDRS: ${DGX_DIRECT_FABRIC_CIDRS:-}

services:
  route-publication-init:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: "no"
    logging: *bounded-logging
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command:
      - python
      - -c
      - >-
        import os;
        os.chown('/routes', 0, 0);
        os.chmod('/routes', 0o700);
        os.makedirs('/routes/generations', mode=0o700, exist_ok=True);
        os.chmod('/routes/generations', 0o700);
        os.chown('/routes/generations', 10001, 10001);
        os.chown('/routes', 10001, 10001)
    volumes:
      - route-publications:/routes

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.api]
    read_only: true
    user: "10001:10001"
    environment:
      <<: *control-environment
    secrets: [database-url, token-signing-key, metrics-token, git-signing-key, agent-client-ca, agent-intermediate-certificate, agent-proxy-auth]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data, agent-proxy]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, dgx_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.worker]
    read_only: true
    user: "10001:10001"
    environment:
      <<: *control-environment
      DGX_AGENT_CA_PROVIDER: step-ca
      DGX_AGENT_RUNTIME: disabled
    secrets: [database-url, token-signing-key, metrics-token, git-signing-key]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository
      - control-state:/state
      - route-publications:/routes
    tmpfs: [/tmp]
    networks: [application, data, cluster-egress]
    depends_on:
      postgres: {condition: service_healthy}
      route-publication-init: {condition: service_completed_successfully}

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.82.3-stable@sha256:b959a1816fa454a14d2842242d0fa1cd0d39f96fc94d3a1f4e1de4e48e2398c6}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/app/dgx-entrypoint]
    read_only: true
    secrets: [litellm-master-key, litellm-upstream-key, litellm-database-url]
    volumes:
      - ./litellm/bootstrap-config.json:/app/bootstrap-config.json:ro
      - ./litellm/entrypoint.sh:/app/dgx-entrypoint:ro
      - ./litellm/config_supervisor.py:/app/config-supervisor.py:ro
      - route-publications:/routes:ro
    tmpfs: [/tmp]
    networks: [data, ingress, cluster-egress]
    depends_on:
      postgres: {condition: service_healthy}
      route-publication-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle=false
    read_only: true
    user: "65534:65534"
    secrets: [metrics-token]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      control-api: {condition: service_healthy}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "472:472"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana-admin-password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    networks: [application, ingress]
    depends_on: [prometheus]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    ports:
      - ${HTTPS_BIND:-0.0.0.0:443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/usr/local/bin/dgx-caddy-entrypoint:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    entrypoint: [/bin/sh, /usr/local/bin/dgx-caddy-entrypoint]
    environment:
      DGX_CONTROL_HOSTNAME: ${DGX_CONTROL_HOSTNAME:?set Caddy control hostname}
      DGX_AGENT_ENROLL_HOSTNAME: ${DGX_AGENT_ENROLL_HOSTNAME:?set Caddy enrollment hostname}
      DGX_AGENT_HOSTNAME: ${DGX_AGENT_HOSTNAME:?set Caddy agent hostname}
      DGX_REGISTRY_HOSTNAME: ${DGX_REGISTRY_HOSTNAME:?set Caddy registry hostname}
    secrets: [agent-client-ca, agent-proxy-auth]
    networks: [ingress, agent-proxy, registry-edge]
    depends_on:
      control-api: {condition: service_started}
      registry: {condition: service_healthy}

  registry:
    image: ${REGISTRY_IMAGE:-registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    tmpfs: [/tmp]
    networks: [registry-edge, registry-publisher]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  database-url:
    file: "${DATABASE_URL_FILE:?set database URL secret file}"
  postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:?set PostgreSQL password secret file}"
  token-signing-key:
    file: "${TOKEN_SIGNING_KEY_FILE:?set token signing key secret file}"
  metrics-token:
    file: "${METRICS_TOKEN_FILE:?set metrics scrape token secret file}"
  git-signing-key:
    file: "${GIT_SIGNING_KEY_FILE:?set Git SSH signing key file}"
  litellm-master-key:
    file: "${LITELLM_MASTER_KEY_FILE:?set LiteLLM master key secret file}"
  litellm-upstream-key:
    file: "${LITELLM_UPSTREAM_KEY_FILE:?set LiteLLM upstream key secret file}"
  litellm-database-url:
    file: "${LITELLM_DATABASE_URL_FILE:?set LiteLLM database URL secret file}"
  grafana-admin-password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:?set Grafana admin password secret file}"
  agent-client-ca:
    file: "${AGENT_CLIENT_CA_FILE:?set agent client CA certificate secret file}"
  agent-intermediate-certificate:
    file: "${AGENT_INTERMEDIATE_CERTIFICATE_FILE:?set agent intermediate certificate secret file}"
  agent-proxy-auth:
    file: "${AGENT_PROXY_AUTH_FILE:?set agent proxy authentication secret file}"

networks:
  ingress: {}
  agent-proxy: {internal: true}
  application: {internal: true}
  data: {internal: true}
  cluster-egress: {}
  registry-edge: {internal: true}
  # No standing service joins this network. A Docker-daemon administrator may
  # attach a digest-pinned one-shot ORAS publisher as documented in registry/README.md.
  registry-publisher: {internal: true}

volumes:
  postgres-data: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
  grafana-data: {}
  registry-data: {}
  route-publications: {}
