name: dgx-forge-control

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set a digest-pinned PostgreSQL image}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.api]
    read_only: true
    user: "10001:10001"
    environment: &control-environment
      DGX_DEPLOYMENT_MODE: production
      DGX_DATABASE_URL_FILE: /run/secrets/database-url
      DGX_TOKEN_SIGNING_KEY_FILE: /run/secrets/token-signing-key
      DGX_METRICS_TOKEN_FILE: /run/secrets/metrics-token
      DGX_REPOSITORY_PATH: /repository
      DGX_STATE_PATH: /state
    secrets: [database-url, token-signing-key, metrics-token]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository:ro
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data, ingress]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, dgx_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.worker]
    read_only: true
    user: "10001:10001"
    environment: *control-environment
    secrets: [database-url, token-signing-key, metrics-token]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository:ro
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data, cluster-egress]
    depends_on:
      postgres: {condition: service_healthy}

  litellm:
    image: ${LITELLM_IMAGE:?set a digest-pinned LiteLLM image}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/app/dgx-entrypoint]
    read_only: true
    secrets: [litellm-master-key, litellm-upstream-key, litellm-database-url]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/entrypoint.sh:/app/dgx-entrypoint:ro
    tmpfs: [/tmp]
    networks: [data, ingress, cluster-egress]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:?set a digest-pinned Prometheus image}
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle=false
    read_only: true
    user: "65534:65534"
    secrets: [metrics-token]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      control-api: {condition: service_healthy}

  grafana:
    image: ${GRAFANA_IMAGE:?set a digest-pinned Grafana image}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "472:472"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana-admin-password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    networks: [application, ingress]
    depends_on: [prometheus]

  caddy:
    image: ${CADDY_IMAGE:?set a digest-pinned Caddy image}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    ports:
      - ${HTTPS_BIND:-0.0.0.0:443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    networks: [ingress]
    depends_on: [control-api]

secrets:
  database-url:
    file: "${DATABASE_URL_FILE:?set database URL secret file}"
  postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:?set PostgreSQL password secret file}"
  token-signing-key:
    file: "${TOKEN_SIGNING_KEY_FILE:?set token signing key secret file}"
  metrics-token:
    file: "${METRICS_TOKEN_FILE:?set metrics scrape token secret file}"
  litellm-master-key:
    file: "${LITELLM_MASTER_KEY_FILE:?set LiteLLM master key secret file}"
  litellm-upstream-key:
    file: "${LITELLM_UPSTREAM_KEY_FILE:?set LiteLLM upstream key secret file}"
  litellm-database-url:
    file: "${LITELLM_DATABASE_URL_FILE:?set LiteLLM database URL secret file}"
  grafana-admin-password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:?set Grafana admin password secret file}"

networks:
  ingress: {}
  application: {internal: true}
  data: {internal: true}
  cluster-egress: {}

volumes:
  postgres-data: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
  grafana-data: {}
