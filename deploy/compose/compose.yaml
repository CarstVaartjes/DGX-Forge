name: dgx-forge-control

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set a digest-pinned PostgreSQL image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    command: [python, -m, dgx_control.api]
    read_only: true
    user: "10001:10001"
    environment: &control-environment
      DGX_DEPLOYMENT_MODE: production
      DGX_DATABASE_URL_FILE: /run/secrets/database-url
      DGX_TOKEN_SIGNING_KEY_FILE: /run/secrets/token-signing-key
      DGX_REPOSITORY_PATH: /repository
      DGX_STATE_PATH: /state
    secrets: [database-url, token-signing-key]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository:ro
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data, ingress]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, dgx_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_IMAGE:?set a digest-pinned control image}
    restart: unless-stopped
    command: [python, -m, dgx_control.worker]
    read_only: true
    user: "10001:10001"
    environment: *control-environment
    secrets: [database-url, token-signing-key]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository:ro
      - control-state:/state
    tmpfs: [/tmp]
    networks: [application, data]
    depends_on:
      postgres: {condition: service_healthy}

  caddy:
    image: ${CADDY_IMAGE:?set a digest-pinned Caddy image}
    restart: unless-stopped
    read_only: true
    ports:
      - ${HTTPS_BIND:-0.0.0.0:443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    networks: [ingress]
    depends_on: [control-api]

secrets:
  database-url:
    file: "${DATABASE_URL_FILE:?set database URL secret file}"
  postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:?set PostgreSQL password secret file}"
  token-signing-key:
    file: "${TOKEN_SIGNING_KEY_FILE:?set token signing key secret file}"

networks:
  ingress: {}
  application: {internal: true}
  data: {internal: true}

volumes:
  postgres-data: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
