include:
  - tailscale/compose.yaml
  - hermes-agent/compose.yaml

name: ${COMPOSE_PROJECT_NAME:-dgx-forge-control}

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-selected-generation-environment: &selected-generation-environment
  DGX_CONTROL_STARTUP_MODE: selected
  DGX_CONTROL_GENERATION_ID: ${DGX_CONTROL_GENERATION_ID:?set selected generation ID}
  DGX_DATABASE_REVISION: ${DGX_DATABASE_REVISION:?set selected database revision}
  DGX_PLATFORM_VERSION: ${DGX_PLATFORM_VERSION:?set released platform version}
  DGX_PLATFORM_RELEASE_DIGEST: ${DGX_PLATFORM_RELEASE_DIGEST:?set released platform digest}
  DGX_PLATFORM_BUILD_DIGEST: ${DGX_PLATFORM_BUILD_DIGEST:?set released build digest}
  # This is per selection attempt and must be supplied by the root host updater,
  # never persisted in the site .env file or immutable generation environment.
  DGX_CONTROL_START_NONCE: ${DGX_CONTROL_START_NONCE:?set fresh selected start nonce}

x-api-environment: &api-environment
  <<: *selected-generation-environment
  DGX_DEPLOYMENT_MODE: production
  DGX_DATABASE_URL_FILE: /run/secrets/database-url
  DGX_TOKEN_SIGNING_KEY_FILE: /run/secrets/token-signing-key
  DGX_METRICS_TOKEN_FILE: /run/secrets/metrics-token
  DGX_REPOSITORY_PATH: /repository
  DGX_STATE_PATH: /state
  DGX_GIT_SIGNING_KEY_FILE: /run/secrets/git-signing-key
  DGX_DEPLOYMENT_BRANCH: ${DEPLOYMENT_BRANCH:-deploy}
  DGX_REQUIRED_CHECKS: ${REQUIRED_CHECKS:-}
  DGX_MANAGEMENT_CIDRS: ${DGX_MANAGEMENT_CIDRS:?set trusted Spark management CIDRs}
  DGX_DIRECT_FABRIC_CIDRS: ${DGX_DIRECT_FABRIC_CIDRS:-}
  DGX_AGENT_ARTIFACT_ROOT: /state/agent-artifacts
  DGX_AGENT_TUF_METADATA_ROOT: /agent-tuf/metadata
  DGX_AGENT_TUF_TARGET_ROOT: /agent-tuf/targets
  DGX_WORKLOAD_TUF_METADATA_ROOT: /workload-tuf/metadata
  DGX_WORKLOAD_TUF_TARGET_ROOT: /workload-tuf/targets
  DGX_WORKLOAD_SIGNER_SOCKET: /run/dgx-workload-signer/signer.sock
  DGX_WORKER_API_TOKEN_FILE: /run/secrets/worker-api-token
  DGX_ADMIN_GRANT_PRIVATE_KEY_FILE: /run/dgx-api-secrets/admin-grant-private-key.pem
  DGX_PACKAGE_HELPER_GRANT_PRIVATE_KEY_FILE: /run/secrets/package-helper-grant-private-key
  DGX_PACKAGE_HELPER_RECEIPT_PRIVATE_KEY_FILE: /run/secrets/package-helper-receipt-private-key
  DGX_CONTROL_IDENTITY_ROOT: /run/dgx-forge/control-identity
  DGX_CONTROL_PROCESS_IMAGE: ${CONTROL_API_IMAGE:?set a digest-pinned control-api image}

x-worker-environment: &worker-environment
  <<: *selected-generation-environment
  DGX_DEPLOYMENT_MODE: production
  DGX_DATABASE_URL_FILE: /run/secrets/database-url
  DGX_WORKER_API_TOKEN_FILE: /run/secrets/worker-api-token
  DGX_INTERNAL_API_URL: http://control-api:8000
  DGX_MANAGEMENT_CIDRS: ${DGX_MANAGEMENT_CIDRS:?set trusted Spark management CIDRs}
  DGX_DIRECT_FABRIC_CIDRS: ${DGX_DIRECT_FABRIC_CIDRS:-}
  DGX_UPDATE_SIGNER_SOCKET: /run/dgx-signer/signer.sock
  DGX_CONTROL_IDENTITY_ROOT: /run/dgx-forge/control-identity
  DGX_CONTROL_PROCESS_IMAGE: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}

services:
  route-publication-init:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: "no"
    logging: *bounded-logging
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command:
      - python
      - -c
      - >-
        import os,pathlib;
        os.chown('/routes', 0, 0);
        os.chmod('/routes', 0o700);
        os.makedirs('/routes/generations', mode=0o700, exist_ok=True);
        os.chmod('/routes/generations', 0o700);
        os.chown('/routes/generations', 10001, 10001);
        os.chown('/routes', 10001, 10001);
        os.makedirs('/supervisor', mode=0o750, exist_ok=True);
        os.chmod('/supervisor', 0o750);
        os.chown('/supervisor', 10002, 10001)
    volumes:
      - route-publications:/routes
      - litellm-supervisor-state:/supervisor

  signer-runtime-init:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: "no"
    logging: *bounded-logging
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command:
      - python
      - -c
      - >-
        import os,pathlib;
        os.chown('/socket',10003,10001);
        os.chmod('/socket',0o710);
        os.chown('/verifier',10003,10001);
        os.chmod('/verifier',0o700);
        os.chown('/publication',10001,10001);
        os.chmod('/publication',0o750);
        [pathlib.Path('/publication',n).mkdir(mode=0o750,exist_ok=True) for n in ('metadata','targets')];
        [os.chown(pathlib.Path('/publication',n),10001,10001) for n in ('metadata','targets')]
    volumes:
      - update-signer-socket:/socket
      - signer-tuf-verifier:/verifier
      - agent-tuf-publication:/publication

  api-admin-grant-init:
    image: ${CONTROL_API_IMAGE:?set a digest-pinned control-api image}
    restart: "no"
    logging: *bounded-logging
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command: [python, -m, dgx_control.runtime_init]
    secrets: [admin-grant-private-key]
    volumes:
      - api-admin-grant-runtime:/runtime

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929}
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U control -d control"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-api:
    image: ${CONTROL_API_IMAGE:?set a digest-pinned control-api image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.api]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *api-environment
    secrets: [database-url, token-signing-key, metrics-token, git-signing-key, agent-client-ca, agent-intermediate-certificate, agent-proxy-auth, worker-api-token, package-helper-grant-private-key, package-helper-receipt-private-key]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository
      - control-state:/state
      - agent-tuf-publication:/agent-tuf
      - workload-tuf-publication:/workload-tuf:ro
      - workload-signer-socket:/run/dgx-workload-signer:ro
      - route-publications:/routes:ro
      - api-admin-grant-runtime:/run/dgx-api-secrets:ro
      - type: bind
        source: ${CONTROL_IDENTITY_PATH:?set control identity directory path}
        target: /run/dgx-forge/control-identity
        read_only: true
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    networks: [application, data, agent-proxy, worker-authority]
    depends_on:
      postgres: {condition: service_healthy}
      api-admin-grant-init: {condition: service_completed_successfully}
      workload-signer: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, dgx_control.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 10

  control-worker:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.worker]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *worker-environment
    secrets: [database-url, worker-api-token]
    volumes:
      - route-publications:/routes
      - litellm-supervisor-state:/supervisor:ro
      - control-state:/state
      - update-signer-socket:/run/dgx-signer
      - type: bind
        source: ${CONTROL_IDENTITY_PATH:?set control identity directory path}
        target: /run/dgx-forge/control-identity
        read_only: true
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    networks: [data, worker-authority]
    depends_on:
      postgres: {condition: service_healthy}
      route-publication-init: {condition: service_completed_successfully}
      control-signer: {condition: service_healthy}

  workload-signer-runtime-init:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: "no"
    logging: *bounded-logging
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    command:
      - python
      - -c
      - >-
        import os,pathlib;
        os.chown('/socket',10003,10001);
        os.chmod('/socket',0o710);
        pathlib.Path('/publication/metadata').mkdir(mode=0o750,parents=True,exist_ok=True);
        pathlib.Path('/publication/targets').mkdir(mode=0o750,parents=True,exist_ok=True);
        [os.chown(pathlib.Path('/publication',n),10003,10001) for n in ('metadata','targets')];
        [os.chmod(pathlib.Path('/publication',n),0o750) for n in ('metadata','targets')]
    volumes:
      - workload-signer-socket:/socket
      - workload-tuf-publication:/publication

  workload-signer:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.workload_signer]
    read_only: true
    user: "10003:10001"
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DGX_WORKLOAD_SIGNER_SOCKET: /run/dgx-workload-signer/signer.sock
      DGX_WORKLOAD_TUF_METADATA_ROOT: /workload-tuf/metadata
      DGX_WORKLOAD_TUF_TARGET_ROOT: /workload-tuf/targets
      DGX_WORKLOAD_REPOSITORY_PATH: /repository
      DGX_DEPLOYMENT_BRANCH: ${DEPLOYMENT_BRANCH:-deploy}
      DGX_WORKLOAD_SIGNER_PEER_UID: "10001"
      DGX_WORKLOAD_RELEASES_KEY_FILE: /run/secrets/workload-releases-key
      DGX_WORKLOAD_SNAPSHOT_KEY_FILE: /run/secrets/workload-snapshot-key
      DGX_WORKLOAD_TIMESTAMP_KEY_FILE: /run/secrets/workload-timestamp-key
    secrets: [workload-releases-key, workload-snapshot-key, workload-timestamp-key]
    volumes:
      - ${REPOSITORY_PATH:?set repository path}:/repository:ro
      - workload-tuf-publication:/workload-tuf
      - workload-signer-socket:/run/dgx-workload-signer
    tmpfs: [/tmp]
    depends_on:
      workload-signer-runtime-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import os,stat; assert stat.S_ISSOCK(os.stat('/run/dgx-workload-signer/signer.sock').st_mode)"]
      interval: 5s
      timeout: 3s
      retries: 12

  control-signer:
    image: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
    restart: unless-stopped
    logging: *bounded-logging
    command: [python, -m, dgx_control.update_signer]
    read_only: true
    user: "10003:10001"
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DGX_AGENT_UPDATE_AUTHORITY_KEY_FILE: /run/secrets/agent-update-authority-key
      DGX_ADMIN_GRANT_PUBLIC_KEY_FILE: /run/secrets/admin-grant-public-key
      DGX_AGENT_TUF_BOOTSTRAP_ROOT_FILE: /run/secrets/agent-tuf-bootstrap-root
      DGX_AGENT_TUF_METADATA_ROOT: /publication/metadata
      DGX_AGENT_TUF_TARGET_ROOT: /publication/targets
      DGX_AGENT_TUF_VERIFIED_METADATA_ROOT: /verifier/metadata
      DGX_AGENT_TUF_VERIFIED_TARGET_ROOT: /verifier/targets
      DGX_CONTROL_IDENTITY_ROOT: /control-identity
      DGX_CONTROL_PROCESS_IMAGE: ${CONTROL_WORKER_IMAGE:?set a digest-pinned control-worker image}
      DGX_UPDATE_SIGNER_SOCKET: /run/dgx-signer/signer.sock
      DGX_PLATFORM_VERSION: ${DGX_PLATFORM_VERSION:?set released platform version}
      DGX_PLATFORM_RELEASE_DIGEST: ${DGX_PLATFORM_RELEASE_DIGEST:?set released platform digest}
      DGX_PLATFORM_BUILD_DIGEST: ${DGX_PLATFORM_BUILD_DIGEST:?set released build digest}
    secrets: [agent-update-authority-key, admin-grant-public-key, agent-tuf-bootstrap-root]
    volumes:
      - agent-tuf-publication:/publication:ro
      - signer-tuf-verifier:/verifier
      - update-signer-socket:/run/dgx-signer
      - type: bind
        source: ${CONTROL_IDENTITY_PATH:?set control identity directory path}
        target: /control-identity
        read_only: true
        bind:
          create_host_path: false
    tmpfs: [/tmp]
    depends_on:
      signer-runtime-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import os,stat; assert stat.S_ISSOCK(os.stat('/run/dgx-signer/signer.sock').st_mode)"]
      interval: 5s
      timeout: 3s
      retries: 12

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.82.3-stable@sha256:b959a1816fa454a14d2842242d0fa1cd0d39f96fc94d3a1f4e1de4e48e2398c6}
    restart: unless-stopped
    logging: *bounded-logging
    entrypoint: [/app/dgx-entrypoint]
    read_only: true
    user: "10002:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DISABLE_ADMIN_UI: "False"
      LITELLM_UI_PATH: /tmp/litellm-ui
      SERVER_ROOT_PATH: /litellm
      STORE_MODEL_IN_DB: "False"
    secrets: [litellm-master-key, litellm-upstream-key, litellm-database-url]
    volumes:
      - ./litellm/bootstrap-config.json:/app/bootstrap-config.json:ro
      - ./litellm/entrypoint.sh:/app/dgx-entrypoint:ro
      - ./litellm/config_supervisor.py:/app/config-supervisor.py:ro
      - route-publications:/routes:ro
      - litellm-supervisor-state:/supervisor:rw
    tmpfs: [/tmp]
    networks: [data, ingress, cluster-egress, hermes-inference]
    depends_on:
      postgres: {condition: service_healthy}
      route-publication-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    restart: unless-stopped
    logging: *bounded-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.enable-lifecycle=false
    read_only: true
    user: "65534:65534"
    secrets: [metrics-token]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      control-api: {condition: service_healthy}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    user: "472:472"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana-admin-password]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    networks: [application, ingress]
    depends_on: [prometheus]

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    ports:
      - target: ${DGX_BACKEND_PORT:-8443}
        published: "${DGX_BACKEND_PORT:-8443}"
        host_ip: ${NAS_LAN_IP:?set reserved NAS LAN IP}
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/usr/local/bin/dgx-caddy-entrypoint:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    entrypoint: [/bin/sh, /usr/local/bin/dgx-caddy-entrypoint]
    environment:
      DGX_CONTROL_HOSTNAME: ${DGX_CONTROL_HOSTNAME:?set Caddy control hostname}
      DGX_AGENT_ENROLL_HOSTNAME: ${DGX_AGENT_ENROLL_HOSTNAME:?set Caddy enrollment hostname}
      DGX_AGENT_HOSTNAME: ${DGX_AGENT_HOSTNAME:?set Caddy agent hostname}
      DGX_REGISTRY_HOSTNAME: ${DGX_REGISTRY_HOSTNAME:?set Caddy registry hostname}
      DGX_BACKEND_PORT: ${DGX_BACKEND_PORT:-8443}
    secrets: [agent-client-ca, agent-proxy-auth]
    networks: [ingress, agent-proxy, registry-edge, tailnet-web-edge]
    depends_on:
      control-api: {condition: service_started}
      registry: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  registry:
    image: ${REGISTRY_IMAGE:-registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33}
    restart: unless-stopped
    logging: *bounded-logging
    read_only: true
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry/config.yml:/etc/distribution/config.yml:ro
      - registry-data:/var/lib/registry
    tmpfs: [/tmp]
    networks: [registry-edge, registry-publisher]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

secrets:
  database-url:
    file: "${DATABASE_URL_FILE:?set database URL secret file}"
  postgres-password:
    file: "${POSTGRES_PASSWORD_FILE:?set PostgreSQL password secret file}"
  token-signing-key:
    file: "${TOKEN_SIGNING_KEY_FILE:?set token signing key secret file}"
  metrics-token:
    file: "${METRICS_TOKEN_FILE:?set metrics scrape token secret file}"
  git-signing-key:
    file: "${GIT_SIGNING_KEY_FILE:?set Git SSH signing key file}"
  litellm-master-key:
    file: "${LITELLM_MASTER_KEY_FILE:?set LiteLLM master key secret file}"
  litellm-upstream-key:
    file: "${LITELLM_UPSTREAM_KEY_FILE:?set LiteLLM upstream key secret file}"
  litellm-database-url:
    file: "${LITELLM_DATABASE_URL_FILE:?set LiteLLM database URL secret file}"
  grafana-admin-password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:?set Grafana admin password secret file}"
  agent-client-ca:
    file: "${AGENT_CLIENT_CA_FILE:?set agent client CA certificate secret file}"
  agent-intermediate-certificate:
    file: "${AGENT_INTERMEDIATE_CERTIFICATE_FILE:?set agent intermediate certificate secret file}"
  agent-proxy-auth:
    file: "${AGENT_PROXY_AUTH_FILE:?set agent proxy authentication secret file}"
  worker-api-token:
    file: "${WORKER_API_TOKEN_FILE:?set worker API token secret file}"
  agent-update-authority-key:
    file: "${AGENT_UPDATE_AUTHORITY_KEY_FILE:?set agent update authority private key file}"
  agent-tuf-bootstrap-root:
    file: "${AGENT_TUF_BOOTSTRAP_ROOT_FILE:?set trusted platform TUF bootstrap root file}"
  admin-grant-public-key:
    file: "${ADMIN_GRANT_PUBLIC_KEY_FILE:?set API admin-grant public key file}"
  admin-grant-private-key:
    file: "${ADMIN_GRANT_PRIVATE_KEY_FILE:?set API admin-grant private key file}"
  package-helper-grant-private-key:
    file: "${PACKAGE_HELPER_GRANT_PRIVATE_KEY_FILE:?set workload package helper grant private key file}"
  package-helper-receipt-private-key:
    file: "${PACKAGE_HELPER_RECEIPT_PRIVATE_KEY_FILE:?set workload package helper receipt private key file}"
  workload-releases-key:
    file: "${WORKLOAD_RELEASES_KEY_FILE:?set workload TUF releases signing key file}"
  workload-snapshot-key:
    file: "${WORKLOAD_SNAPSHOT_KEY_FILE:?set workload TUF snapshot signing key file}"
  workload-timestamp-key:
    file: "${WORKLOAD_TIMESTAMP_KEY_FILE:?set workload TUF timestamp signing key file}"

networks:
  ingress: {}
  agent-proxy: {internal: true}
  application: {internal: true}
  worker-authority: {internal: true}
  data: {internal: true}
  cluster-egress: {}
  registry-edge: {internal: true}
  # No standing service joins this network. A Docker-daemon administrator may
  # attach a digest-pinned one-shot ORAS publisher as documented in registry/README.md.
  registry-publisher: {internal: true}

volumes:
  postgres-data: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
  litellm-supervisor-state: {}
  prometheus-data: {}
  grafana-data: {}
  registry-data: {}
  route-publications: {}
  update-signer-socket: {}
  signer-tuf-verifier: {}
  agent-tuf-publication: {}
  workload-tuf-publication: {}
  workload-signer-socket: {}
  api-admin-grant-runtime: {}
