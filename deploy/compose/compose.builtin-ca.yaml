services:
  control-api:
    environment:
      DGX_AGENT_CA_PROVIDER: builtin
      DGX_AGENT_BUILTIN_CA_BOOTSTRAP: "1"
      DGX_AGENT_INTERMEDIATE_KEY_FILE: /run/secrets/agent-intermediate-key
      # Docker Compose !reset/!override requires Compose v2.24.4 or newer.
      DGX_AGENT_CA_CREDENTIAL_FILE: !reset null
    secrets: !override
      - database-url
      - token-signing-key
      - metrics-token
      - git-signing-key
      - agent-client-ca
      - agent-intermediate-certificate
      - agent-proxy-auth
      - agent-intermediate-key

  step-ca:
    profiles: [step-ca]

secrets:
  agent-intermediate-key:
    file: "${AGENT_INTERMEDIATE_KEY_FILE:?set development built-in agent intermediate signing key secret file}"
