services:
  control-api:
    environment:
      DGX_AGENT_CA_PROVIDER: builtin
      DGX_AGENT_RUNTIME: enabled
      DGX_AGENT_BUILTIN_CA_BOOTSTRAP: "1"
      DGX_AGENT_CLIENT_CA_FILE: /run/secrets/agent-client-ca
      DGX_AGENT_INTERMEDIATE_CERTIFICATE_FILE: /run/secrets/agent-intermediate-certificate
      DGX_AGENT_INTERMEDIATE_KEY_FILE: /run/secrets/agent-intermediate-key
      DGX_AGENT_PROXY_AUTH_FILE: /run/secrets/agent-proxy-auth
    secrets: [agent-intermediate-key]

secrets:
  agent-intermediate-key:
    file: "${AGENT_INTERMEDIATE_KEY_FILE:?set development built-in agent intermediate signing key secret file}"
