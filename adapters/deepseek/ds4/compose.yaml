name: ds4-deepseek-single

services:
  ds4-deepseek-single:
    image: ${DS4_IMAGE}
    container_name: ds4-deepseek-single
    pull_policy: always
    restart: "no"
    network_mode: host
    gpus: all
    group_add:
      - "${DS4_MODELS_GID:?DS4_MODELS_GID is required}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1024m
    volumes:
      - ${DS4_SNAPSHOT_DIR}:/models:ro
      - ${DS4_DERIVED_DIR}:/var/lib/ds4/derived:rw
      - ${DS4_KV_DIR}:/var/lib/ds4/kv:rw
      - ${DS4_LOG_DIR}:/var/log/ds4:rw
    environment:
      - DS4_SERVED_MODEL_NAME=deepseek
      - DS4_NO_UPDATE_CHECK=1
      - DS4_CONT_MTP_MODE=2
      - DS4_CONT_DSPARK=1
      - DS4_DSPARK_MODEL=/models/DSpark-drafter-Q2K-Q8-0731.gguf
    command:
      - --cuda
      - -m
      - /models/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
      - -c
      - "32768"
      - --host
      - 127.0.0.1
      - --port
      - "8888"
      - --kv-disk-dir
      - /var/lib/ds4/kv
      - --kv-disk-space-mb
      - "8192"
