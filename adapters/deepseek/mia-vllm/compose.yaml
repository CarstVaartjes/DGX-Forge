name: mia-deepseek-dual-${ROLE}

services:
  runtime:
    image: ghcr.io/anemll/dspark-vllm-gx10@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8
    container_name: mia-deepseek-dual-${ROLE}
    pull_policy: never
    restart: "no"
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: 64gb
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - /srv/models/snapshots/deepseek-v4-flash-0731:/models/deepseek-ai/DeepSeek-V4-Flash-0731:ro
      - /srv/models/runtime-cache/deepseek-agent-dual:/runtime-cache:rw
      - /srv/models/runtime-cache/deepseek-agent-dual/tmp:/tmp:rw
      - /srv/models/outputs/deepseek-agent-dual:/outputs:rw
      - /srv/models/logs/deepseek-agent-dual:/logs:rw
    environment:
      DVONK_MODEL: ${DVONK_MODEL}
      DVONK_ENCODING_FILE: ${DVONK_ENCODING_FILE}
      VLLM_CACHE_ROOT: ${VLLM_CACHE_ROOT}
      FLASHINFER_WORKSPACE_BASE: ${FLASHINFER_WORKSPACE_BASE}
      VLLM_HOST_IP: ${VLLM_HOST_IP}
      HF_HOME: /runtime-cache/huggingface
      MASTER_ADDR: ${MASTER_ADDR}
      MASTER_PORT: ${MASTER_PORT}
      NODE_RANK: ${NODE_RANK}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_B12X_MOE: "1"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: ""
      CUTE_DSL_ARCH: sm_121a
      TORCH_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      ENABLE_VLLM_GB10_PATCH: "0"
      MTP_NUM_TOKENS: "5"
      DEFAULT_THINKING: low
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      NCCL_IB_HCA: ${NCCL_IB_HCA}
      NCCL_IB_GID_INDEX: ${NCCL_IB_GID_INDEX}
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      NCCL_NVLS_ENABLE: "0"
      TP_SOCKET_IFNAME: ${TP_SOCKET_IFNAME}
      GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME}
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export PATH="/usr/local/cuda/bin:/usr/local/bin:$${PATH:-}"
        export CUDA_HOME="/usr/local/cuda"
        export CUDA_PATH="/usr/local/cuda"
        export CUDAToolkit_ROOT="/usr/local/cuda"
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}"
        cp "$${DVONK_ENCODING_FILE}" /usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4_encoding.py
        python3 -c 'from pathlib import Path; p=Path("/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4.py"); s=p.read_text(); old="elif reasoning_effort in (\"max\", \"xhigh\"):\n                reasoning_effort = \"max\"\n            else:\n                reasoning_effort = \"high\""; new="elif reasoning_effort in (\"max\", \"xhigh\"):\n                reasoning_effort = \"max\"\n            elif reasoning_effort == \"high\":\n                reasoning_effort = \"high\"\n            else:\n                reasoning_effort = \"low\""; updated=s.replace(old,new); assert new in updated; p.write_text(updated)'
        exec /usr/local/bin/vllm serve "$${DVONK_MODEL}" \
          --served-model-name deepseek \
          --host 127.0.0.1 \
          --port 8888 \
          --trust-remote-code \
          --tensor-parallel-size 2 \
          --pipeline-parallel-size 1 \
          --kv-cache-dtype nvfp4_ds_mla \
          --block-size 256 \
          --max-model-len 1048576 \
          --max-num-seqs 6 \
          --max-num-batched-tokens 8192 \
          --max-cudagraph-capture-size 36 \
          --gpu-memory-utilization 0.80 \
          --enable-prefix-caching \
          --enable-prompt-tokens-details \
          --async-scheduling \
          --enable-chunked-prefill \
          --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}' \
          --tokenizer-mode deepseek_v4 \
          --distributed-executor-backend mp \
          --moe-backend flashinfer_b12x \
          --tool-call-parser deepseek_v4 \
          --enable-auto-tool-choice \
          --reasoning-parser deepseek_v4 \
          --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}' \
          --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"low"}' \
          --generation-config vllm \
          --enable-flashinfer-autotune \
          --nnodes 2 \
          --node-rank "$${NODE_RANK}" \
          --master-addr "$${MASTER_ADDR}" \
          --master-port "$${MASTER_PORT}" \
          ${HEADLESS_FLAG}
