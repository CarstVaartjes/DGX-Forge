[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-profiles"
version = "0.1.0"
description = "Developer-machine contracts for DGX Spark workload profiles"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[tool.hatch.build.targets.wheel.force-include]
"src/spark_profiles/schemas/workload.schema.json" = "spark_profiles/schemas/workload.schema.json"
"src/spark_profiles/schemas/cluster-profile.schema.json" = "spark_profiles/schemas/cluster-profile.schema.json"
"src/spark_profiles/schemas/model-definitions.schema.json" = "spark_profiles/schemas/model-definitions.schema.json"
"src/spark_profiles/schemas/model-definition-evidence.schema.json" = "spark_profiles/schemas/model-definition-evidence.schema.json"
"src/spark_profiles/schemas/accepted-cluster-profiles.schema.json" = "spark_profiles/schemas/accepted-cluster-profiles.schema.json"
"src/spark_profiles/schemas/node-health-raw.schema.json" = "spark_profiles/schemas/node-health-raw.schema.json"
"src/spark_profiles/schemas/node-health.schema.json" = "spark_profiles/schemas/node-health.schema.json"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
