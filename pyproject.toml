[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-profiles"
version = "0.1.0"
description = "Developer-machine contracts for DGX Spark workload profiles"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
