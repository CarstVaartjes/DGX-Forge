[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgx-agent-protocol"
version = "1.0.0"
description = "Versioned, fenced contracts for DGX Forge Spark agents"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dgx_agent_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"src/dgx_agent_protocol/schemas/agent-job.schema.json" = "dgx_agent_protocol/schemas/agent-job.schema.json"
"src/dgx_agent_protocol/schemas/agent-result.schema.json" = "dgx_agent_protocol/schemas/agent-result.schema.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
