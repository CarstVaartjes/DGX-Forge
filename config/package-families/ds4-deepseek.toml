schema_version = 1
family_id = "ds4-deepseek"
validation_deployment = "ds4-deepseek-single"

[source]
provider = "git"
locator = "https://github.com/Entrpi/ds4"
policy_refs = ["policy://origins/github"]

[versions]
scheme = "opaque"
channels = ["legacy"]
include_prereleases = false

[discovery]
poll_interval_seconds = 3600
bindings = [{ target = "release.commit", source = "release.commit", value_type = "git-commit", required = true }]

[resolution]
recipe_version = 1
components = [
  { name = "model", kind = "model", media_type = "application/vnd.vonk-forge.model.v1", materialization = "archive", platforms = ["linux/arm64"] },
  { name = "runtime-image", kind = "runtime", media_type = "application/vnd.oci.image.manifest.v1+json", materialization = "oci-image", platforms = ["linux/arm64"] },
]
dependencies = []

[policy]
required_evidence = ["checksum", "provenance"]
license_policy_refs = ["policy://licenses/deepseek"]

[compatibility]
architectures = ["linux-arm64"]
operating_systems = ["ubuntu-24.04"]
min_memory_bytes = 120000000000
min_storage_bytes = 120000000000

[execution]
backend = "oci"
adapter_abi = 1

[[validation]]
kind = "artifact"
timeout_seconds = 300

[[validation]]
kind = "health"
timeout_seconds = 120

[[validation]]
kind = "inference"
timeout_seconds = 900

[retention]
release_count = 2
rollback_count = 1
