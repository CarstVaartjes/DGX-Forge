port = 9101

[commands]
prepare = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "prepare"]
verify = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "verify"]
start = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "start"]
health = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "health"]
infer = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "infer"]
stop = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "stop"]
verify-release = ["/opt/spark/model-adapters/nemotron-nano-omni-single/bin/nemotron-nano-omni-single", "verify-release"]

[deadlines]
prepare = 86400
verify = 600
start = 1800
health = 120
infer = 1800
stop = 300
verify-release = 300

[resources]
minimum_free_memory_bytes = 12000000000
minimum_free_disk_bytes = 100000000000
stop_memory_tolerance_bytes = 1073741824
