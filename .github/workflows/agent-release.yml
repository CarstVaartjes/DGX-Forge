name: Rust Vonk Forge agent release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vonk-forge-agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-sign:
    name: Build, lifecycle-test, and sign ARM64 package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: agent-release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      package: ${{ steps.metadata.outputs.package }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Validate immutable release metadata
        id: metadata
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            version=${GITHUB_REF_NAME#v}
            git tag --points-at "$GITHUB_SHA" | grep -Fx -- "$GITHUB_REF_NAME" >/dev/null
          else
            test "$GITHUB_REF" = refs/heads/main
            version=$DISPATCH_VERSION
            [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          fi
          package="vonk-forge-agent_${version}_arm64.deb"
          printf 'version=%s\npackage=%s\n' "$version" "$package" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy,rustfmt
          rustup default 1.97.1

      - name: Materialize protected release key
        shell: bash
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.VONK_AGENT_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/vonk-agent-release.pem"
          printf '%s' "$RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/vonk-agent-release.pem"

      - name: Build package twice reproducibly
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VONK_SOURCE_REVISION: ${{ github.sha }}
          VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          scripts/build-agent-deb \
            --version "$VERSION" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --source-date-epoch "$epoch" \
            --output-dir dist
          scripts/build-agent-deb \
            --version "$VERSION" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --binaries-dir target/aarch64-unknown-linux-gnu/release \
            --source-date-epoch "$epoch" \
            --output-dir reproducible
          cmp --silent \
            "dist/vonk-forge-agent_${VERSION}_arm64.deb" \
            "reproducible/vonk-forge-agent_${VERSION}_arm64.deb"
          scripts/verify-agent-deb --json "dist/vonk-forge-agent_${VERSION}_arm64.deb"

      - name: Run Rust and packaging security gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          uvx --from pytest==9.1.1 pytest -q \
            tests/scripts/test_agent_deb.py \
            tests/acceptance/test_rust_agent_parity.py
          scripts/verify-agent-systemd --json \
            | tee dist/vonk-forge-systemd-security.json

      - name: Test fresh, offline, upgrade, downgrade, remove lifecycle
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          VONK_SOURCE_REVISION: ${{ github.sha }}
          VONK_SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "lifecycle check failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fuse-overlayfs podman slirp4netns
          package="dist/vonk-forge-agent_${VERSION}_arm64.deb"
          sudo env SYSTEMD_OFFLINE=1 dpkg -i "$package"
          getent passwd vonk-agent >/dev/null
          test "$(stat -c %a /var/lib/vonk-forge-agent)" = 700
          test "$(basename "$(readlink /var/lib/vonk-forge/supervisor/current)")" = a
          sudo install -d -o vonk-agent -g vonk-agent -m 0700 \
            /run/vonk-forge-agent
          sudo -u vonk-agent env \
            HOME=/var/lib/vonk-forge-agent \
            XDG_DATA_HOME=/var/lib/vonk-forge-agent \
            XDG_RUNTIME_DIR=/run/vonk-forge-agent \
            CONTAINERS_STORAGE_CONF=/etc/vonk-forge-agent/containers-storage.conf \
            podman info --format '{{.Host.Security.Rootless}}' \
            | grep -Fx true >/dev/null
          printf '\n# lifecycle-preserved\n' | sudo tee -a /etc/vonk-forge-agent/agent.toml >/dev/null
          sudo install -o vonk-agent -g vonk-agent -m 0600 /dev/null \
            /var/lib/vonk-forge-agent/lifecycle-preserved

          IFS=. read -r major minor patch <<< "$VERSION"
          next_version="${major}.${minor}.$((patch + 1))"
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          scripts/build-agent-deb \
            --version "$next_version" \
            --release-private-key "$RUNNER_TEMP/vonk-agent-release.pem" \
            --binaries-dir target/aarch64-unknown-linux-gnu/release \
            --source-date-epoch "$epoch" \
            --output-dir lifecycle
          sudo env SYSTEMD_OFFLINE=1 dpkg -i \
            "lifecycle/vonk-forge-agent_${next_version}_arm64.deb"
          grep -Fx '# lifecycle-preserved' /etc/vonk-forge-agent/agent.toml >/dev/null
          test -x /var/lib/vonk-forge/slots/b/vonk-agent
          test "$(basename "$(readlink /var/lib/vonk-forge/supervisor/current)")" = a

          downgrade_log=$RUNNER_TEMP/downgrade.log
          if sudo env SYSTEMD_OFFLINE=1 dpkg -i "$package" >"$downgrade_log" 2>&1; then
            echo "downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'refusing downgrade' "$downgrade_log" >/dev/null
          echo "refused downgrade"

          sudo env SYSTEMD_OFFLINE=1 dpkg --remove vonk-forge-agent
          test -f /etc/vonk-forge-agent/agent.toml
          test -f /var/lib/vonk-forge-agent/lifecycle-preserved
          sudo env SYSTEMD_OFFLINE=1 dpkg -i \
            "lifecycle/vonk-forge-agent_${next_version}_arm64.deb"
          grep -Fx '# lifecycle-preserved' /etc/vonk-forge-agent/agent.toml >/dev/null
          sudo env SYSTEMD_OFFLINE=1 dpkg --remove vonk-forge-agent

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create keyless Sigstore bundle
        shell: bash
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "dist/${PACKAGE}.sigstore.json" "dist/$PACKAGE"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/agent-release.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
          else
            identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/agent-release.yml@refs/heads/main$"
          fi
          cosign verify-blob \
            --bundle "dist/${PACKAGE}.sigstore.json" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "dist/$PACKAGE"
          rm -f "$RUNNER_TEMP/vonk-agent-release.pem"

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.metadata.outputs.package }}

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.metadata.outputs.package }}
          sbom-path: dist/vonk-forge-agent_${{ steps.metadata.outputs.version }}_arm64.sbom.spdx.json

      - name: Upload exact release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vonk-agent-release-${{ steps.metadata.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: dist/*

      - name: Create public GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/* \
            --verify-tag \
            --title "Vonk Forge agent v$VERSION" \
            --notes "Signed ARM64 Vonk Forge agent package. Verify before installation; see docs/operations/agent-package-release.md."

  publish-apt:
    name: Publish signed packages.vonkforge.ai apt repository
    if: github.ref_type == 'tag'
    needs: build-test-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: apt-release
    concurrency:
      group: vonk-forge-apt-publication
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vonk-agent-release-${{ needs.build-test-sign.outputs.version }}
          path: dist

      - name: Install repository tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y aptly gnupg rclone

      - name: Restore private aptly state
        id: state
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aptly" "$RUNNER_TEMP/apt-public"
          restored=false
          if rclone copyto \
            "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz" \
            "$RUNNER_TEMP/aptly-state.tar.gz"; then
            rclone copyto \
              "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz.sha256" \
              "$RUNNER_TEMP/aptly-state.tar.gz.sha256"
            (cd "$RUNNER_TEMP" && sha256sum -c aptly-state.tar.gz.sha256)
            if tar -tzf "$RUNNER_TEMP/aptly-state.tar.gz" \
              | awk '$0 !~ /^aptly(\/|$)/ || $0 ~ /(^|\/)\.\.(\/|$)/ || $0 ~ /^\// { bad=1 } END { exit !bad }'; then
              echo "aptly state archive contains an unsafe path" >&2
              exit 1
            fi
            if tar -tvzf "$RUNNER_TEMP/aptly-state.tar.gz" | awk '$1 ~ /^[lh]/ { found=1 } END { exit !found }'; then
              echo "aptly state archive contains links" >&2
              exit 1
            fi
            tar -xzf "$RUNNER_TEMP/aptly-state.tar.gz" -C "$RUNNER_TEMP"
            restored=true
          fi
          printf 'restored=%s\n' "$restored" >> "$GITHUB_OUTPUT"

      - name: Publish signed apt index locally
        shell: bash
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_REPOSITORY_GPG_PRIVATE_KEY: ${{ secrets.APT_REPOSITORY_GPG_PRIVATE_KEY }}
          APT_REPOSITORY_GPG_FINGERPRINT: ${{ vars.APT_REPOSITORY_GPG_FINGERPRINT }}
          PACKAGE: ${{ needs.build-test-sign.outputs.package }}
          RESTORED: ${{ steps.state.outputs.restored }}
          VERSION: ${{ needs.build-test-sign.outputs.version }}
        run: |
          set -euo pipefail
          scripts/verify-agent-deb --json "dist/$PACKAGE"
          install -m 0600 /dev/null "$RUNNER_TEMP/apt-repository-key.asc"
          install -m 0600 /dev/null "$RUNNER_TEMP/apt-repository-passphrase"
          printf '%s' "$APT_REPOSITORY_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/apt-repository-key.asc"
          printf '%s' "$APT_GPG_PASSPHRASE" > "$RUNNER_TEMP/apt-repository-passphrase"
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import "$RUNNER_TEMP/apt-repository-key.asc"
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          test "$fingerprint" = "$APT_REPOSITORY_GPG_FINGERPRINT"
          config=$RUNNER_TEMP/aptly.conf
          jq -n \
            --arg root "$RUNNER_TEMP/aptly" \
            --arg publish "$RUNNER_TEMP/apt-public" \
            '{rootDir:$root,architectures:["arm64"],dependencyFollowSuggests:false,
              dependencyFollowRecommends:false,
              FileSystemPublishEndpoints:{r2:{rootDir:$publish,linkMethod:"copy"}}}' \
            > "$config"
          if [[ "$RESTORED" != true ]]; then
            aptly -config="$config" repo create -distribution=stable -component=main vonk-forge
          fi
          aptly -config="$config" repo add vonk-forge "dist/$PACKAGE"
          aptly -config="$config" snapshot create "v$VERSION" from repo vonk-forge
          common=(-batch -passphrase-file="$RUNNER_TEMP/apt-repository-passphrase" -gpg-key="$fingerprint")
          if [[ "$RESTORED" == true ]]; then
            aptly -config="$config" publish switch "${common[@]}" stable filesystem:r2: "v$VERSION"
          else
            aptly -config="$config" publish snapshot "${common[@]}" \
              -architectures=arm64 -distribution=stable -component=main \
              "v$VERSION" filesystem:r2:
          fi
          test -s "$RUNNER_TEMP/apt-public/dists/stable/InRelease"
          gpg --batch --verify "$RUNNER_TEMP/apt-public/dists/stable/InRelease"
          gpg --batch --export "$fingerprint" \
            > "$RUNNER_TEMP/apt-public/vonk-forge-archive-keyring.gpg"
          gpg --batch --armor --export "$fingerprint" \
            > "$RUNNER_TEMP/apt-public/vonk-forge-archive-keyring.asc"

      - name: Publish public repository then durable state
        shell: bash
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_TYPE: s3
          R2_APT_PUBLIC_BUCKET: ${{ vars.R2_APT_PUBLIC_BUCKET }}
          R2_APT_STATE_BUCKET: ${{ vars.R2_APT_STATE_BUCKET }}
          VERSION: ${{ needs.build-test-sign.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$R2_APT_PUBLIC_BUCKET"
          test -n "$R2_APT_STATE_BUCKET"
          rclone copy "$RUNNER_TEMP/apt-public/" "r2:${R2_APT_PUBLIC_BUCKET}/"
          tar -czf "$RUNNER_TEMP/aptly-state.tar.gz" -C "$RUNNER_TEMP" aptly
          (cd "$RUNNER_TEMP" && sha256sum aptly-state.tar.gz > aptly-state.tar.gz.sha256)
          rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz" \
            "r2:${R2_APT_STATE_BUCKET}/versions/${VERSION}/aptly-state.tar.gz"
          rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz.sha256" \
            "r2:${R2_APT_STATE_BUCKET}/versions/${VERSION}/aptly-state.tar.gz.sha256"
          rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz" \
            "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz"
          rclone copyto "$RUNNER_TEMP/aptly-state.tar.gz.sha256" \
            "r2:${R2_APT_STATE_BUCKET}/latest/aptly-state.tar.gz.sha256"
          printf 'Published v%s to https://packages.vonkforge.ai/\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
