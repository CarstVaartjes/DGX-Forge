[project]
name = "dgx-agent"
version = "0.1.0"
description = "DGX Forge outbound agent runtime scaffold"
requires-python = ">=3.12"
dependencies = ["dgx-agent-protocol==1.0.0", "tuf==7.0.0", "securesystemslib[crypto]==1.4.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv.sources]
dgx-agent-protocol = { path = "../inventory/wheels/dgx_agent_protocol-1.0.0-py3-none-any.whl" }
