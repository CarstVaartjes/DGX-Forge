[project]
name = "dgx-agent"
version = "0.1.0"
description = "DGX Forge outbound agent runtime scaffold"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.0", "dgx-agent-protocol==2.1.0", "spark-profiles==0.1.0", "tuf==7.0.0", "securesystemslib[crypto]==1.4.0"]

[project.scripts]
dgx-forge-agent = "dgx_agent.main:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyinstaller==6.15.0", "pytest==8.4.2"]

[tool.uv.sources]
dgx-agent-protocol = { path = "../inventory/wheels/dgx_agent_protocol-2.1.0-py3-none-any.whl" }
spark-profiles = { path = ".." }
